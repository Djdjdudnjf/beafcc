<script>
  /* تطبيق اللغة والثيم قبل أول رسم لتفادي الوميض */
  (function () {
    try {
      var lang = localStorage.getItem('etqan.lang') || 'ar';
      var theme = localStorage.getItem('etqan.theme');
      if (!theme) {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      var el = document.documentElement;
      el.lang = lang;
      el.dir = lang === 'ar' ? 'rtl' : 'ltr';
      el.dataset.theme = theme;
    } catch (e) {}
  })();
</script>

<!-- Service Worker Registration for PWA -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('service-worker.js', { scope: './' })
        .then(function(registration) {
          console.log('[PWA] Service Worker registered:', registration);

          // Check for updates periodically
          setInterval(function() {
            registration.update();
          }, 60000); // Check every minute

          // Listen for updates
          registration.addEventListener('updatefound', function() {
            var newWorker = registration.installing;
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'activated') {
                var msg = 'تم تحديث المنصة. أعد تحميل الصفحة للحصول على النسخة الجديدة.';
                if (localStorage.getItem('etqan.lang') === 'en') {
                  msg = 'Platform updated. Reload the page to get the latest version.';
                }
                console.log('[PWA] Update available:', msg);
                // Optional: show a toast notification
                var root = document.getElementById('toastRoot');
                if (root) {
                  root.innerHTML = '<div class="toast"><span>' + msg + '</span></div>';
                }
              }
            });
          });
        })
        .catch(function(error) {
          console.log('[PWA] Service Worker registration failed:', error);
        });
    });
  }

  // Handle app installation prompt
  var installPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    installPrompt = e;
    console.log('[PWA] Install prompt available');
  });
</script>
