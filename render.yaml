services:
  - type: web
    name: replay
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server/server.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
